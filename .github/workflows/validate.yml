name: validate
on: [push, pull_request]
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_skills.py
      - run: bash -n skills/ios-game-simulator-automation/scripts/sim_smoke.sh scripts/install.sh
